<!doctype html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afrekenen — Freshly</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        body { font-family: 'Figtree', sans-serif; font-size: 0.95rem; line-height: 1.6; color: #3d4a43; }
        h1, h2, h5, h6, .navbar-brand, .btn { font-family: 'Quicksand', sans-serif; }
        .fw-semibold, .fw-bold { font-variant-numeric: tabular-nums; }
        a { color: #4a8b6f; }
        a:hover { color: #2d6a4f; }
        .ph-img { background: repeating-linear-gradient(45deg, #eef4f0, #eef4f0 8px, #e3efe8 8px, #e3efe8 16px); }
        .pay-btn { background: #4a8b6f; transition: background .15s ease; }
        .pay-btn:hover { background: #2d6a4f; }
        .sec-head { font-size: 0.72rem; letter-spacing: 0.06em; color: #4a8b6f; background-color: #f1f6f3; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white shadow-sm" style="margin-bottom: 40px;">
    <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand fw-bold fs-4" href="freshly-home.html" style="color: #4a8b6f;">🌿 Freshly</a>
        <a class="btn btn-sm fw-semibold px-3 rounded-3" style="background-color: #e3efe8; color: #2d6a4f;" href="freshly-cart.html">🛒 Winkelmandje</a>
    </div>
</nav>

<main class="container px-3 px-md-4 py-2" style="max-width: 520px;">

    <a class="d-inline-flex align-items-center gap-1 text-decoration-none mb-3" style="color: #9aa8a0; font-size: 0.9rem;" href="freshly-cart.html">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Terug naar mandje
    </a>

    <div class="bg-white rounded-3 shadow-sm overflow-hidden">
        <h6 class="fw-bold text-uppercase mb-0 px-4 py-3 border-bottom sec-head">Afrekenen</h6>
        <div class="p-4">


            <div th:object="${shoppingCart}">

                <div th:each="item : *{items}">

                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div class="flex-shrink-0 rounded-3 overflow-hidden ph-img" style="width: 44px; height: 44px;"></div>
                        <div class="flex-grow-1 lh-sm">
                            <div class="fw-bold" style="color:#1f2a24; font-size:.9rem;" th:text="${item.product.price}"></div>
                            <div class="small text-secondary" th:text="${item.product.productName}"></div>
                        </div>
                    </div>

                </div>

            </div>


            <hr style="border-color: #e9efeb;" />

            <div class="d-flex justify-content-between align-items-baseline mb-4">
                <span class="fw-bold" style="color: #1f2a24;">Totaal</span>
                <span class="fw-bold" style="font-size: 1.4rem; color: #2d6a4f;">€ 6,77</span>
            </div>

            <!-- One Stripe button -->
            <button type="button" onclick="pay()" class="btn pay-btn text-white fw-semibold w-100 rounded-3 py-2 d-flex align-items-center justify-content-center gap-2">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                Betaal € 6,77
            </button>

            <div class="d-flex align-items-center justify-content-center gap-1 mt-3 small text-secondary">
                Powered by <strong style="color:#6772e5;font-family:'Quicksand',sans-serif;">stripe</strong>
            </div>
        </div>
    </div>

</main>

<!-- Success overlay -->
<div id="successOverlay" style="display:none; position:fixed; inset:0; background:rgba(31,42,36,.55); z-index:1080; align-items:center; justify-content:center; padding:1rem;">
    <div class="bg-white rounded-4 shadow text-center p-5" style="max-width:400px;">
        <div class="mx-auto mb-3 d-flex align-items-center justify-content-center" style="width:64px;height:64px;border-radius:50%;background:#e3efe8;">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2d6a4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <h5 class="fw-bold mb-2" style="color:#1f2a24;">Betaling gelukt!</h5>
        <p class="text-secondary mb-4">Bedankt voor je bestelling. We bezorgen je verse boodschappen vandaag.</p>
        <a th:href="@{/home}" class="btn pay-btn text-white fw-semibold px-4 rounded-3">Verder winkelen</a>
    </div>
</div>

<script>
    function pay() {
        // In productie: redirect naar je Stripe Payment Link of Checkout Session.
        // window.location.href = 'https://buy.stripe.com/your-payment-link';
        document.getElementById('successOverlay').style.display = 'flex';
    }
</script>
</body>
</html>
