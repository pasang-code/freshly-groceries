<!doctype html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productdetails</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Figtree', sans-serif; font-size: 0.95rem; line-height: 1.6; color: #3d4a43; }
      h1, h5, h6, .navbar-brand, .btn { font-family: 'Quicksand', sans-serif; }
      p, label, .form-label, small { letter-spacing: 0.01em; }
      .fw-semibold, .fw-bold { font-variant-numeric: tabular-nums; }
      a { color: #4a8b6f; }
      a:hover { color: #2d6a4f; }
      .qty-btn { width: 40px; height: 40px; border: none; background: transparent; color: #4a8b6f; font-size: 1.25rem; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
      .qty-btn:hover { background: #f1f6f3; }
      .qty-group { border: 1px solid #d8e5dd; border-radius: 8px; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm" style="margin-bottom: 16px;">
    <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand fw-bold fs-4" th:href="@{/home}" style="color: #4a8b6f;">🌿 Freshly</a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#collapselist">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="collapselist">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                <li class="nav-item"><a class="nav-link rounded-2 text-dark" th:href="@{/home}" style="color: #4a8b6f;">Home</a></li>
                <li class="nav-item"><a class="nav-link rounded-2 text-dark" href="#">Favorieten</a></li>
                <li class="nav-item"><a sec:authorize="!isAuthenticated()" class="nav-link rounded-2 text-dark" th:href="@{/login}">Inloggen</a></li>
                <li class="nav-item"><a sec:authorize="isAuthenticated()" class="nav-link rounded-2 text-dark" th:href="@{/logout}">afmelden</a></li>
                <li class="nav-item ms-lg-2">
                    <a class="btn btn-sm fw-semibold px-3 rounded-3" style="background-color: #e3efe8; color: #2d6a4f;" th:href="@{/shopping-cart}">🛒 Winkelmandje</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main th:if="${product}" th:object="${product}" class="container px-3 px-md-4 py-2">

    <!-- Toolbar: terug + prev/next -->
    <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
        <a class="btn btn-link text-decoration-none fw-semibold px-2 d-inline-flex align-items-center gap-1" style="color: #4a8b6f;" th:href="@{/home}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Terug
        </a>
        <div class="d-flex gap-1 ms-auto">
            <a class="btn btn-link text-decoration-none fw-semibold px-2 d-inline-flex align-items-center gap-1" style="color: #4a8b6f;" th:href="@{/product-details/{id}(id=${product.id - 1})}">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Vorige
            </a>
            <a class="btn btn-link text-decoration-none fw-semibold px-2 d-inline-flex align-items-center gap-1" style="color: #4a8b6f;" th:href="@{/product-details/{id}(id=${product.id + 1})}">
                Volgende
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </a>
        </div>
    </div>

    <div class="row g-4 g-lg-5 align-items-center">

        <!-- PRODUCT IMAGE -->
        <div class="col-12 col-md-5">
            <div class="rounded-4 overflow-hidden shadow-sm" style="background-color: #f1f6f3; padding: 16px;">
                <img th:src="*{imageUrl}" src="/img/banana.jpg" alt="product" class="w-100 rounded-3 object-fit-cover" style="aspect-ratio: 1/1;" />
            </div>
        </div>

        <!-- PRODUCT INFO -->
        <div class="col-12 col-md-7">

            <!-- Brand + admin edit -->
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
                <a th:href="@{/brand-details/{id}(id=*{brand.id})}"
                   class="text-decoration-none text-uppercase fw-bold"
                   style="font-size: 0.72rem; letter-spacing: 0.08em; color: #4a8b6f;"
                   th:text="*{brand.name}"></a>

                <a sec:authorize="hasAuthority('ADMIN')" class="btn btn-sm rounded-3 fw-semibold"
                   style="background-color: #fbecea; color: #b23a2e;"
                   th:href="@{/admin/product-details-edit/{id}(id=${product.id})}">Bewerken</a>
            </div>

            <h1 class="fw-bold mb-2" style="font-size: 2.1rem; color: #1f2a24; line-height: 1.15;" th:text="*{productName}"></h1>

            <!-- Price -->
            <div class="d-flex align-items-baseline gap-2 mb-4">
                <span class="fw-bold" style="font-size: 2.4rem; color: #2d6a4f;" th:text="|€ *{price}|"></span>
            </div>

            <!-- Quantity + add to cart -->
            <form method="post" th:action="@{/shopping-cart-add}">
                <div class="d-flex align-items-center gap-3 mb-3 flex-wrap">
                    <div class="d-inline-flex align-items-center qty-group overflow-hidden">
                        <button class="qty-btn" type="button" onclick="var i=document.getElementById('aantal'); i.value=Math.max(1,(+i.value||1)-1);">−</button>
                        <input type="number" name="quantity" min="1" value="1" id="aantal"
                               class="text-center fw-bold" style="width: 52px; height: 40px; color: #1f2a24; border: none; border-left: 1px solid #d8e5dd; border-right: 1px solid #d8e5dd;"
                               th:classappend="(${invalidInput})?'border border-danger':''" />
                        <button class="qty-btn" type="button" onclick="var i=document.getElementById('aantal'); i.value=(+i.value||1)+1;">+</button>
                    </div>
                    <button class="btn fw-semibold text-white rounded-3 px-4 py-2 flex-grow-1" style="background-color: #4a8b6f; min-width: 220px;" type="submit">
                        In winkelmandje
                    </button>
                </div>
                <input type="hidden" th:value="${product.id}" name="productId" />
                <p th:if="${invalidInput}" class="small text-danger mb-3">Geen geldig aantal.</p>
            </form>

            <hr style="border-color: #e9efeb;" />

            <!-- Description -->
            <h6 class="fw-bold mb-2" style="color: #1f2a24;">Over dit product</h6>
            <p class="mb-4" th:text="*{description}"></p>

            <!-- Detail rows -->
            <div class="d-flex justify-content-between py-2">
                <span class="text-secondary">Gewicht</span>
                <span class="fw-semibold" style="color: #1f2a24;" th:text="|*{weight} g|"></span>
            </div>


            <!-- Biologisch + categorieën -->
            <div class="d-flex flex-wrap gap-2 mb-3">
                <span th:if="*{organic}" class="rounded-pill px-3 py-1 fw-semibold" style="background-color: #e3efe8; color: #2d6a4f; font-size: 0.8rem;">Biologisch</span>
                <a th:each="category : ${product.categories}"
                   class="rounded-pill px-3 py-1 fw-semibold text-decoration-none"
                   style="background-color: #eef4f0; color: #4a8b6f; font-size: 0.8rem;"
                   th:text="${category.name}" th:href="@{/category-details/{id}(id=${category.id})}"></a>


            </div>



        </div>

    </div>
</main>

<main th:unless="${product}" class="container py-5 text-center">
    <p class="fs-1">🛒</p>
    <h5 class="fw-bold" style="color: #1f2a24;">Geen geldig product geselecteerd.</h5>
    <a class="btn mt-3 text-white fw-semibold rounded-3" style="background-color: #4a8b6f;" th:href="@{/home}">Terug naar overzicht</a>
</main>

<footer class="bg-dark text-white text-center py-4 mt-5">
    <small class="text-white-50">© 2026 Freshly — Vers aan jouw deur.</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
