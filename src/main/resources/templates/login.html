<!doctype html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inloggen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Figtree', sans-serif; font-size: 0.95rem; line-height: 1.6; color: #3d4a43; }
      h1, h5, h6, .navbar-brand, .btn { font-family: 'Quicksand', sans-serif; }
      p, label, .form-label, small { letter-spacing: 0.01em; }
      .fw-semibold, .fw-bold { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm" style="margin-bottom: 16px;">
    <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand fw-bold fs-4" th:href="@{/home}" style="color: #4a8b6f;">🌿 Freshly</a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#collapselist">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="collapselist">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                <li class="nav-item"><a class="nav-link rounded-2 text-dark" th:href="@{/home}">Home</a></li>
                <li class="nav-item"><a class="nav-link rounded-2 text-dark" href="#">Favorieten</a></li>
                <li class="nav-item">
                    <a sec:authorize="!isAuthenticated()" class="nav-link rounded-2 active fw-semibold" style="color: #4a8b6f;" th:href="@{/login}">Inloggen</a>
                    <a sec:authorize="isAuthenticated()" class="nav-link rounded-2" th:href="@{/logout}">afmelden</a>
                </li>
                <li class="nav-item ms-lg-2">
                    <a class="btn btn-sm fw-semibold px-3 rounded-3" style="background-color: #e3efe8; color: #2d6a4f;" th:href="@{/shopping-cart}">🛒 Winkelmandje</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<section class="py-5">
    <div class="container-fluid px-3 px-md-4">
        <h1 class="fw-bold display-6" style="color: #2d6a4f;">Welkom terug.</h1>
        <p class="mt-2 mb-0 text-secondary">Log in om verder te winkelen bij Freshly.</p>
    </div>
</section>

<main class="container-fluid px-3 px-md-4 py-5 d-flex justify-content-center">
    <div style="max-width: 420px; width: 100%;">
        <div class="bg-white rounded-3 shadow-sm p-4 p-md-5">
            <h5 class="fw-bold mb-4 text-center">Inloggen bij Freshly</h5>

            <div class="alert alert-danger py-2 small" th:if="${param.error}">Ongeldige gebruikersnaam of wachtwoord.</div>
            <div class="alert alert-success py-2 small" th:if="${param.logout}">Je bent uitgelogd.</div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold small text-uppercase text-secondary">Gebruikersnaam</label>
                    <input id="username" name="username" type="text" class="form-control rounded-3" placeholder="jouw gebruikersnaam" required />
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold small text-uppercase text-secondary">Wachtwoord</label>
                    <input id="password" name="password" type="password" class="form-control rounded-3" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn w-100 rounded-3 fw-semibold text-white" style="background-color: #4a8b6f;">Inloggen</button>
                <a th:href="@{/home}" class="btn btn-outline-secondary w-100 rounded-3 mt-2">Annuleren</a>
            </form>
        </div>
    </div>
</main>

<footer class="bg-dark text-white text-center py-4 mt-5">
    <small class="text-white-50">© 2026 Freshly — Vers aan jouw deur.</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
