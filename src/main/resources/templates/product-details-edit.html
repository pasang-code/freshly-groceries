<!doctype html>
<html lang="nl">
<head th:replace="~{fragments/header::head}">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

<header th:insert="~{fragments/navbar::navigationBar}"></header>

<main th:if="${product}" th:object="${product}">

    <div class="container px-3 px-md-4 pt-2">

        <!-- TOOLBAR -->
        <div class="bg-white rounded-3 shadow-sm px-3 py-2 d-flex align-items-center justify-content-between gap-2 flex-wrap mb-4">
            <a class="btn btn-link text-decoration-none fw-semibold px-2 d-inline-flex align-items-center gap-1" style="color: #4a8b6f;"
               th:href="@{/product-details/{id}(id=*{id})}">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Terug naar product
            </a>
            <span class="fw-semibold small text-uppercase" style="letter-spacing: 0.06em; color: #4a8b6f;">Admin — Product bewerken</span>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-7">
                <div class="bg-white rounded-3 shadow-sm p-4 p-md-5">

                    <h5 class="fw-bold mb-4" style="color: #2d6a4f;">✏️ Product bewerken</h5>

                    <form th:action="@{/admin/product-details-edit/{id}(id=*{id})}"
                          method="post"
                          th:object="${product}">

                        <div class="mb-3">
                            <label class="form-label fw-bold text-uppercase mb-1" style="font-size: 0.72rem; letter-spacing: 0.06em; color: #4a8b6f;">Productnaam</label>
                            <input type="text" th:field="*{productName}" class="form-control rounded-3"
                                   th:classappend="(${#fields.hasErrors('productName')})?' border-danger':''" />
                            <div th:if="${#fields.hasErrors('productName')}" class="small text-danger mt-1">Geen geldige naam.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-uppercase mb-1" style="font-size: 0.72rem; letter-spacing: 0.06em; color: #4a8b6f;">Omschrijving</label>
                            <textarea th:field="*{description}" class="form-control rounded-3" rows="3"
                                      th:classappend="(${#fields.hasErrors('description')})?' border-danger':''"></textarea>
                            <div th:if="${#fields.hasErrors('description')}" class="small text-danger mt-1">Geen geldige beschrijving.</div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label fw-bold text-uppercase mb-1" style="font-size: 0.72rem; letter-spacing: 0.06em; color: #4a8b6f;">Prijs</label>
                                <div class="input-group" th:classappend="(${#fields.hasErrors('price')})?' border border-danger rounded-3':''">
                                    <span class="input-group-text">€</span>
                                    <input type="number" step="0.01" th:field="*{price}" min="0.00" class="form-control rounded-end-3" />
                                </div>
                                <div th:if="${#fields.hasErrors('price')}" class="small text-danger mt-1">Geen geldige prijs.</div>
                            </div>
                            <div class="col-6">
                                <label class="form-label fw-bold text-uppercase mb-1" style="font-size: 0.72rem; letter-spacing: 0.06em; color: #4a8b6f;">Gewicht</label>
                                <div class="input-group" th:classappend="(${#fields.hasErrors('weight')})?' border border-danger rounded-3':''">
                                    <input type="number" step="0.01" min="0.00" th:field="*{weight}" class="form-control rounded-start-3" />
                                    <span class="input-group-text">g</span>
                                </div>
                                <div th:if="${#fields.hasErrors('weight')}" class="small text-danger mt-1">Geen geldig gewicht.</div>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-12 col-sm-6">
                                <label class="form-label fw-bold text-uppercase mb-1" style="font-size: 0.72rem; letter-spacing: 0.06em; color: #4a8b6f;">Merk</label>
                                <select name="brand" class="form-select rounded-3">
                                    <option th:each="brand : ${brands}" th:value="${brand.id}" th:text="${brand.name}" th:selected="${brand.name.equals(product.brand.name)}"></option>
                                </select>
                            </div>
                            <div class="col-12 col-sm-6">
                                <label class="form-label fw-bold text-uppercase mb-1" style="font-size: 0.72rem; letter-spacing: 0.06em; color: #4a8b6f;">Categorie</label>
                                <select multiple name="categories" class="form-select rounded-3" style="min-height: 88px;">
                                    <option th:each="category : ${categories}" th:selected="${#lists.contains(product.categories,category)}" th:value="${category.id}" th:text="${category.name}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-uppercase mb-1" style="font-size: 0.72rem; letter-spacing: 0.06em; color: #4a8b6f;">Afbeelding URL</label>
                            <input type="text" th:field="*{imageUrl}" class="form-control rounded-3" />
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-uppercase mb-1" style="font-size: 0.72rem; letter-spacing: 0.06em; color: #4a8b6f;">Biologisch</label>
                            <div class="d-flex gap-3 mt-1">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="organic" value="true" id="organicJa" th:checked="*{organic == true}" />
                                    <label class="form-check-label" for="organicJa">Ja</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="organic" value="false" id="organicNee" th:checked="*{organic == false}" />
                                    <label class="form-check-label" for="organicNee">Nee</label>
                                </div>
                            </div>
                        </div>

                        <hr style="border-color: #e9efeb;" />

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn fw-semibold text-white rounded-3 flex-grow-1 py-2" style="background-color: #4a8b6f;">💾 Opslaan</button>
                            <a th:href="@{/product-details/{id}(id=*{id})}" class="btn btn-outline-secondary rounded-3 px-4">Annuleren</a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</main>

<main th:unless="${product}" class="container py-5 text-center">
    <h4 class="text-secondary">Geen geldig product geselecteerd.</h4>
    <a class="btn mt-3 text-white fw-semibold rounded-3" style="background-color: #4a8b6f;" th:href="@{/home}">Terug naar overzicht</a>
</main>

<footer class="bg-dark text-white text-center py-4 mt-5">
    <small class="text-white-50">© 2026 Freshly — Vers aan jouw deur.</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
