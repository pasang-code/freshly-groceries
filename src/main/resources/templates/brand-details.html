<!doctype html>
<html lang="nl" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merkdetails</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body { font-family: 'Figtree', sans-serif; font-size: 0.95rem; line-height: 1.6; color: #3d4a43; }
      h1, h5, h6, .navbar-brand, .btn { font-family: 'Quicksand', sans-serif; }
      p, label, .form-label, small { letter-spacing: 0.01em; }
      .fw-semibold, .fw-bold { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm" style="margin-bottom: 16px;">
    <div class="container-fluid px-3 px-md-4">
        <a class="navbar-brand fw-bold fs-4" th:href="@{/home}" style="color: #4a8b6f;">🌿 Freshly</a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#collapselist">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="collapselist">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                <li class="nav-item"><a class="nav-link rounded-2 text-dark" th:href="@{/home}" style="color: #4a8b6f;">Home</a></li>
                <li class="nav-item"><a class="nav-link rounded-2 text-dark" href="#">Favorieten</a></li>
                <li class="nav-item"><a sec:authorize="!isAuthenticated()" class="nav-link rounded-2 text-dark" th:href="@{/login}">Inloggen</a></li>
                <li class="nav-item"><a sec:authorize="isAuthenticated()" class="nav-link rounded-2 text-dark" th:href="@{/logout}">Uitloggen</a></li>
                <li class="nav-item ms-lg-2">
                    <a class="btn btn-sm fw-semibold px-3 rounded-3" style="background-color: #e3efe8; color: #2d6a4f;" th:href="@{/shopping-cart}">🛒 Winkelmandje</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main th:if="${brand}" th:object="${brand}" class="container-fluid px-3 px-md-4 py-2">

    <!-- TOOLBAR -->
    <div class="bg-white rounded-3 shadow-sm px-3 py-2 d-flex align-items-center gap-2 flex-wrap mb-4">
        <a class="btn btn-link text-decoration-none fw-semibold px-2" style="color: #4a8b6f;" th:href="@{/home}">← Terug</a>
    </div>

    <div class="row g-4 align-items-start">

        <!-- BRAND IMAGE -->
        <div class="col-12 col-md-4">
            <div class="bg-white rounded-3 shadow-sm overflow-hidden">
                <img th:src="@{|https://placehold.co/600x400/e8f5e9/2d6a4f?font=open-sans&text=${brand.getName()}|}"
                     alt="Brand" class="w-100 object-fit-cover" style="aspect-ratio: 4/3;">
            </div>
        </div>

        <!-- BRAND INFO -->
        <div class="col-12 col-md-8">
            <div class="bg-white rounded-3 shadow-sm p-4">

                <h1 class="fw-bold mb-1" style="color: #2d6a4f;" th:text="*{name}"></h1>
                <p class="fst-italic text-secondary mb-1" th:text="*{slogan}"></p>
                <p class="text-secondary small mb-4" th:text="|Opgericht in *{foundingYear}|"></p>

                <h6 class="fw-bold text-uppercase mb-3" style="font-size: 0.72rem; letter-spacing: 0.06em; color: #4a8b6f;">Producten in assortiment</h6>

                <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 g-3">
                    <div class="col" th:each="product : *{products}">
                        <a class="text-decoration-none text-reset d-block h-100"
                           th:href="@{/product-details/{id}(id=${product.id})}">
                            <div class="rounded-3 border overflow-hidden h-100 d-flex flex-column" style="border-color: #e9efeb !important;">
                                <img th:src="@{${product.imageUrl}}"
                                     alt="product" class="w-100 object-fit-cover"
                                     style="aspect-ratio: 4/3;">
                                <div class="p-3 d-flex flex-column flex-grow-1">
                                    <p class="fw-semibold small mb-1" style="color: #1f2a24;" th:text="${product.productName}"></p>
                                    <p class="fw-bold text-success small mb-0 mt-auto" th:text="|€ ${product.price}|"></p>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>

            </div>
        </div>

    </div>

</main>

<main th:unless="${brand}" class="container py-5 text-center">
    <h4 class="text-secondary">Geen geldig merk geselecteerd.</h4>
    <a class="btn rounded-3 mt-3 text-white fw-semibold" style="background-color: #4a8b6f;" th:href="@{/home}">Terug naar overzicht</a>
</main>

<footer class="bg-dark text-white text-center py-4 mt-5">
    <small class="text-white-50">© 2026 Freshly — Vers aan jouw deur.</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
